<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ZBoard Clipper</title>
    <style>
      :root {
        --ink: #23221f;
        --ink-2: #6b6860;
        --line: #e2dfd7;
        --bg: #f4f3ef;
        --accent: #2f6fde;
        --danger: #c93a32;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 380px;
        font: 13px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--ink);
        background: #fff;
      }
      body.page {
        width: auto;
        max-width: 480px;
        margin: 40px auto;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        font-weight: 700;
      }
      header img {
        width: 20px;
        height: 20px;
      }
      header .grow {
        flex: 1;
      }
      header button {
        font-weight: 400;
      }
      main {
        padding: 12px;
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--ink-2);
        margin: 8px 0 3px;
      }
      input,
      select {
        width: 100%;
        padding: 7px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        font: inherit;
        background: #fff;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 6px;
        padding: 7px 12px;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .link {
        border: 0;
        background: none;
        color: var(--accent);
        padding: 0;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .row > * {
        flex: 1;
      }
      .status {
        margin-top: 10px;
        min-height: 18px;
        color: var(--ink-2);
      }
      .status.error {
        color: var(--danger);
      }
      .status.ok {
        color: #2f9e44;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        max-height: 300px;
        overflow-y: auto;
        margin-top: 10px;
      }
      .tile {
        position: relative;
        aspect-ratio: 1;
        border: 2px solid transparent;
        border-radius: 6px;
        overflow: hidden;
        background: var(--bg);
        cursor: pointer;
        padding: 0;
      }
      .tile img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .tile.on {
        border-color: var(--accent);
      }
      .tile.on::after {
        content: '✓';
        position: absolute;
        top: 4px;
        right: 4px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        font-size: 12px;
        line-height: 20px;
        text-align: center;
      }
      .muted {
        color: var(--ink-2);
      }
      .images-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 14px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon-48.png" alt="" />
      <span class="grow">ZBoard Clipper</span>
      <button id="open-settings" class="link" hidden>Settings</button>
    </header>

    <main id="setup" hidden>
      <div class="muted">Connect to your ZBoard. In ZBoard open Menu → Browser extension to find both values.</div>
      <label for="server">Server address</label>
      <input id="server" placeholder="http://localhost:3000" autocomplete="off" />
      <label for="token">Token</label>
      <input id="token" placeholder="Paste the token" autocomplete="off" />
      <div class="row">
        <button id="connect" class="primary">Connect</button>
      </div>
      <div id="setup-status" class="status"></div>
    </main>

    <main id="main" hidden>
      <label for="board">Save to board</label>
      <select id="board"></select>
      <div class="row">
        <button id="save-page">Save page link</button>
      </div>
      <div class="images-head">
        <span id="images-label" class="muted">Looking for images…</span>
        <button id="select-all" class="link" hidden>Select all</button>
      </div>
      <div id="grid" class="grid"></div>
      <div class="row">
        <button id="save-images" class="primary" disabled>Save images</button>
      </div>
      <div id="status" class="status"></div>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
